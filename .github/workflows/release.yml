name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    package-release:
        runs-on: windows-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Create clean TimelogMCP.zip
                run: |
                    $stage = "dist\timelog-mcp"
                    $build = "$stage\build"
                    New-Item -ItemType Directory -Force -Path $build | Out-Null
                    Copy-Item app.py, launch.py, requirements.txt, pyproject.toml, README.md -Destination $build
                    Copy-Item timelog -Destination "$build\timelog" -Recurse
                    Get-ChildItem $build -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force

                    $ws = New-Object -ComObject WScript.Shell
                    $s = $ws.CreateShortcut("$PWD\$stage\mcp.lnk")
                    $s.TargetPath = "$env:SystemRoot\System32\cmd.exe"
                    $s.Arguments = '/c py -3 build\launch.py || python build\launch.py'
                    $s.WorkingDirectory = ''
                    $s.WindowStyle = 7
                    $s.IconLocation = 'build\timelog\desktop\ui\icons\timelog.ico,0'
                    $s.Save()

                    Compress-Archive -Path $stage -DestinationPath dist\TimelogMCP.zip -Force

            -   name: Upload workflow artifact
                uses: actions/upload-artifact@v4
                with:
                    name: TimelogMCP
                    path: dist/TimelogMCP.zip

            -   name: Publish GitHub Release
                if: startsWith(github.ref, 'refs/tags/v')
                uses: softprops/action-gh-release@v2
                with:
                    files: dist/TimelogMCP.zip
