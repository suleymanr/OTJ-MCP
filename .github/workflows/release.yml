name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    package-release:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Create clean TimelogMCP.zip
                run: |
                    mkdir -p dist/TimelogMCP
                    cp app.py launch.py launch.cmd launch.command requirements.txt pyproject.toml README.md dist/TimelogMCP/
                    cp -r timelog dist/TimelogMCP/
                    find dist/TimelogMCP -type d -name "__pycache__" -exec rm -rf {} +
                    chmod +x dist/TimelogMCP/launch.command
                    cd dist
                    zip -r TimelogMCP.zip TimelogMCP

            -   name: Upload workflow artifact
                uses: actions/upload-artifact@v4
                with:
                    name: TimelogMCP
                    path: dist/TimelogMCP.zip

            -   name: Publish GitHub Release
                if: startsWith(github.ref, 'refs/tags/v')
                uses: softprops/action-gh-release@v2
                with:
                    files: dist/TimelogMCP.zip
